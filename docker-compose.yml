services:
  pixelwise:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/pixelwise.docker.nginx:/etc/nginx/conf.d/default.conf
      - ./frontend:/var/www/pixelwise
    depends_on:
      pixelwise:
        condition: service_healthy
    restart: always
volumes:
  db-data:
